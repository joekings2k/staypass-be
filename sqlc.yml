version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"          # sqlc reads the Up blocks, ignores the Down drops
    queries: "internal/platform/db/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/platform/db/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true